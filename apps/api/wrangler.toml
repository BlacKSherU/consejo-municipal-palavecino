name = "cmp-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[triggers]
crons = ["0 */6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "cmp-db"
database_id = "f07c1546-eada-4845-87d1-233afe5d356c"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cmp-assets"

# Variables locales: usá apps/api/.dev.vars (no subir a git) para JWT_SECRET en dev.
# En producción: JWT_SECRET se setea con `npx wrangler secret put JWT_SECRET`.
[vars]
# CORS_ORIGIN: origen del FRONT (Cloudflare Pages), NO la URL del Worker. Sin esto, el login desde
# *.pages.dev falla con "NetworkError / CORS". Varios orígenes: coma sin espacios.
CORS_ORIGIN = "https://consejo-municipal-palavecino.pages.dev,http://localhost:4321"
# En producción configúrala en el Dashboard del Worker (recomendado) o en .dev.vars local.

# Secretos (nunca en git): wrangler secret put NOMBRE
#   JWT_SECRET          — en producción sustituye el [vars] de arriba si usas secret
#   META_ACCESS_TOKEN   — token largo Meta Graph (Instagram)
#   INSTAGRAM_USER_ID   — id numérico de la cuenta Instagram Business
